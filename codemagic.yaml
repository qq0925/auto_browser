workflows:
  build-release:
    name: Auto Browser Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        PUSH_API_URL: "http://test.txsj.ink/push.php"
        UPLOAD_TOKEN: "lwd54088"

    scripts:
      - name: Get dependencies
        script: |
          flutter packages pub get

      - name: Build Android APK
        script: |
          flutter build apk --release

      - name: Build iOS App
        script: |
          # 仅构建 .app，不签名 (若配置了证书，去掉 --no-codesign)
          flutter build ios --release --no-codesign

      - name: Prepare Python Script
        script: |
          cat << 'EOF' > ipa_converter.py
          import zipfile
          import os
          import shutil
          import tempfile
          import sys

          def process_zip(input_zip_path, output_ipa_name=None):
              if not os.path.exists(input_zip_path):
                  print(f"File {input_zip_path} not found")
                  return

              if output_ipa_name is None:
                  output_ipa_name = 'auto_browser.ipa'

              output_ipa_name = os.path.abspath(output_ipa_name)

              with tempfile.TemporaryDirectory() as tmp_dir:
                  print(f"Extracting {input_zip_path}...")
                  with zipfile.ZipFile(input_zip_path, 'r') as zip_ref:
                      zip_ref.extractall(tmp_dir)

                  payload_dir = os.path.join(tmp_dir, 'Payload')
                  os.makedirs(payload_dir, exist_ok=True)

                  print("Moving files to Payload...")
                  for item in os.listdir(tmp_dir):
                      item_path = os.path.join(tmp_dir, item)
                      if item == 'Payload':
                          continue
                      shutil.move(item_path, payload_dir)

                  if os.path.exists(output_ipa_name):
                      os.remove(output_ipa_name)

                  print(f"Creating IPA at {output_ipa_name}...")
                  with zipfile.ZipFile(output_ipa_name, 'w', zipfile.ZIP_DEFLATED) as zipf:
                      for root, _, files in os.walk(payload_dir):
                          for file in files:
                              file_path = os.path.join(root, file)
                              arcname = os.path.relpath(file_path, start=tmp_dir)
                              zipf.write(file_path, arcname)

                  print(f"Success! IPA generated: {output_ipa_name}")

          if __name__ == "__main__":
              if len(sys.argv) < 2:
                  print("Please provide zip path")
              else:
                  process_zip(sys.argv[1])
          EOF

      - name: Process Artifacts (Rename & Convert)
        script: |
          # 1. 处理 Android APK
          APK_SOURCE="build/app/outputs/flutter-apk/app-release.apk"
          if [ -f "$APK_SOURCE" ]; then
              echo "Renaming Android APK..."
              mv "$APK_SOURCE" auto_browser.apk
          fi

          # 2. 处理 iOS (Runner.app -> Temp Zip -> IPA)
          IOS_SOURCE="build/ios/iphoneos/Runner.app"
          if [ -d "$IOS_SOURCE" ]; then
              echo "Packing iOS Runner.app to temp zip..."
              pushd build/ios/iphoneos
              zip -r -q temp_runner.zip Runner.app
              popd

              echo "Running Python conversion..."
              python3 ipa_converter.py build/ios/iphoneos/temp_runner.zip
          fi

      - name: Upload Artifacts to PHP Server
        script: |
          upload_to_server() {
            local file_path="$1"
            if [ ! -f "$file_path" ]; then
              echo "Warning: File $file_path does not exist, skipping upload."
              return 0
            fi

            echo "=========================================="
            echo "Uploading $file_path to $PUSH_API_URL..."
            echo "=========================================="

            # 同时在 Header (X-Upload-Token) 和 POST 表单 (-F token) 传递密钥
            HTTP_RESPONSE=$(curl --silent --write-out "\nHTTP_STATUS:%{http_code}" \
              --connect-timeout 60 \
              --max-time 600 \
              -X POST "$PUSH_API_URL" \
              -H "X-Upload-Token: ${UPLOAD_TOKEN}" \
              -F "token=${UPLOAD_TOKEN}" \
              -F "file=@$file_path")

            HTTP_BODY=$(echo "$HTTP_RESPONSE" | sed -e '$d')
            HTTP_STATUS=$(echo "$HTTP_RESPONSE" | tail -n 1 | sed -e 's/HTTP_STATUS://')

            echo "Server Response: $HTTP_BODY"
            echo "HTTP Status Code: $HTTP_STATUS"

            if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
              echo ">>> Upload successful for $file_path!"
            else
              echo ">>> Upload failed for $file_path with status $HTTP_STATUS"
              exit 1
            fi
          }

          # 依次上传覆盖 APK 与 IPA
          upload_to_server "auto_browser.apk"
          upload_to_server "auto_browser.ipa"

    artifacts:
      - auto_browser.apk
      - auto_browser.ipa

    publishing:
      email:
        recipients:
          - your_email@example.com