pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
        return flutterSdkPath
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "9.3.1" apply false
    id "org.jetbrains.kotlin.android" version "2.4.20" apply false
}

// 兼容 AGP 9.0+：自动将三方库插件（如 flutter_inappwebview_android）中已被 AGP 9 移除的
// 'proguard-android.txt' 无缝替换为 'proguard-android-optimize.txt'，防止编译报错中断
gradle.beforeProject { p ->
    ['com.android.build.gradle.BaseExtension',
     'com.android.build.gradle.LibraryExtension',
     'com.android.build.gradle.AppExtension'].each { clsName ->
        try {
            def clazz = Class.forName(clsName)
            def orig = clazz.metaClass.getMetaMethod("getDefaultProguardFile", [String] as Class[])
            if (orig != null && clazz.metaClass.getMetaMethod("getDefaultProguardFile_orig", [String] as Class[]) == null) {
                clazz.metaClass.getDefaultProguardFile_orig = { String name ->
                    return orig.invoke(delegate, name)
                }
                clazz.metaClass.getDefaultProguardFile = { String name ->
                    if (name == 'proguard-android.txt') {
                        name = 'proguard-android-optimize.txt'
                    }
                    return delegate.getDefaultProguardFile_orig(name)
                }
            }
        } catch (Throwable ignored) {}
    }
}

include ":app"
